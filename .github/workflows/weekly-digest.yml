name: Weekly digest

on:
  schedule:
    - cron: "0 8 * * 2" # Tuesday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAILS: ${{ secrets.DIGEST_EMAILS }}
        run: node scripts/digest.ts
